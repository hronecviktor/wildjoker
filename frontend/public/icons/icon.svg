<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Wild Joker's app icon. Everything that matters sits inside the
       central circle of radius 205, so it survives Android's masks. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#22804f"/>
      <stop offset="1" stop-color="#11462d"/>
    </radialGradient>
    <pattern id="back" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#8c1c2d"/>
      <rect width="11" height="22" fill="#b3263a"/>
    </pattern>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece0ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#felt)"/>
  <g transform="translate(256 262) scale(1.12) translate(-256 -262)">
  <!-- the deck behind -->
  <g transform="rotate(-14 256 270)" filter="url(#shadow)">
    <rect x="150" y="128" width="170" height="240" rx="20" fill="url(#back)" stroke="#fff" stroke-width="10"/>
  </g>
  <!-- the joker in front -->
  <g transform="rotate(10 256 270)" filter="url(#shadow)">
    <rect x="196" y="140" width="170" height="240" rx="20" fill="url(#face)" stroke="#a77df5" stroke-width="6"/>
    <text x="226" y="198" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#7b2ff2" text-anchor="middle">★</text>
    <text x="281" y="318" font-family="Arial, Helvetica, sans-serif" font-size="130" fill="#7b2ff2" text-anchor="middle">★</text>
  </g>
  </g>
</svg>
