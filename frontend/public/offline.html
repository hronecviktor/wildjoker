<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a2c" />
    <link rel="icon" href="/icons/favicon-32.png" />
    <title>Wild Joker</title>
    <!-- Shown by the service worker (sw.js) when the server can't be reached. -->
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #f2f5fa;
        background: #0f1a2c;
      }
      body {
        display: flex;
        min-height: 100dvh;
        margin: 0;
        padding: 24px 16px;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        color: #a9b6cc;
        line-height: 1.4;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: #2f6fe4;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="title">No connection</h1>
      <p id="text">Wild Joker needs the internet to play. Check your connection and try again.</p>
      <button type="button" id="retry" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // The app's language choice (lib/i18n), or the phone's.
      let lang = "en";
      try {
        lang = JSON.parse(localStorage.getItem("wildjoker.lang")) || "";
      } catch {}
      if (!lang) lang = (navigator.language || "en").slice(0, 2);
      if (lang === "sk") {
        document.documentElement.lang = "sk";
        document.getElementById("title").textContent = "Bez pripojenia";
        document.getElementById("text").textContent =
          "Wild Joker potrebuje na hranie internet. Skontrolujte pripojenie a skúste to znova.";
        document.getElementById("retry").textContent = "Skúsiť znova";
      }
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
