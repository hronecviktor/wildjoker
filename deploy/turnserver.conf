# coturn configuration for Wild Joker voice chat.
# Install as /etc/turnserver.conf. Values marked CHANGE are yours to choose.

# -- Network -------------------------------------------------------------------

# STUN/TURN over UDP and TCP, and TURN over TLS.
listening-port=3478
tls-listening-port=5349

# CHANGE: only if the server's public IP is NOT on its network interface
# (cloud NAT, e.g. AWS/GCP): external-ip=<public IP>/<private IP>.
# Check with `ip -4 addr` (interface IPs) and `curl -4 ifconfig.me` (public).
# If the public IP is on the interface (most VPS, e.g. Hetzner), leave it out.
#external-ip=203.0.113.10/10.0.0.5

# Ports used for relayed audio. Open the same range in the firewall.
# Each player whose connection needs the relay uses one port per other
# player, so 300 ports is plenty for a few concurrent games.
min-port=49152
max-port=49451

# -- Authentication --------------------------------------------------------------

# Time-limited credentials ("TURN REST API"): the game server signs them
# with this shared secret, nothing is stored here.
use-auth-secret
# CHANGE: the same value as WILDJOKER_TURN_SECRET in deploy/.env.
static-auth-secret=CHANGE_ME

# CHANGE if you use another domain.
realm=zolik.0s.is
server-name=zolik.0s.is

fingerprint

# -- TLS (port 5349) ----------------------------------------------------------------

# Copies of Caddy's certificate, kept up to date by coturn-certs.sh.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# -- Security ------------------------------------------------------------------

# Browsers only need UDP relays.
no-tcp-relay
no-multicast-peers
# Never relay into private, loopback or other special networks (protects the
# server and its local network from being reached through the relay).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits: relays per user (one player) and in total.
user-quota=12
total-quota=300
stale-nonce=600

# No telnet admin interface.
no-cli

# -- Logging -------------------------------------------------------------------

# To the systemd journal: journalctl -u coturn
log-file=stdout
simple-log
