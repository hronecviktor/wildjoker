# Wild Joker game server. Run from this directory:
#   docker compose up -d --build
# Settings come from .env next to this file (copy env.example).
name: wildjoker
services:
  wildjoker:
    build: ..
    image: wildjoker:latest
    restart: unless-stopped
    # Only reachable from the host itself; Caddy proxies to it.
    ports:
      - "127.0.0.1:${WILDJOKER_PORT:-8100}:8000"
    environment:
      WILDJOKER_TURN_URLS: ${WILDJOKER_TURN_URLS:-}
      WILDJOKER_TURN_SECRET: ${WILDJOKER_TURN_SECRET:?set WILDJOKER_TURN_SECRET in deploy/.env}
      WILDJOKER_STUN_URLS: ${WILDJOKER_STUN_URLS:-stun:stun.l.google.com:19302}
      WILDJOKER_TURN_TTL: ${WILDJOKER_TURN_TTL:-43200}
      # Trust X-Forwarded-For from Caddy (the port is bound to localhost only).
      FORWARDED_ALLOW_IPS: "*"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
