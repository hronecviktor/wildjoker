[project]
name = "wildjoker"
version = "0.1.0"
description = "Wild Joker: real-time multiplayer rummy server"
requires-python = ">=3.13"
dependencies = [
    "highspy>=1.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
